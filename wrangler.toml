# Cloudflare Workers — sitio estático servido como assets (Astro sin adapter).
# Deploy:  npx wrangler deploy      (sube ./dist como assets)
# Local:   npx wrangler dev         (sirve ./dist con el runtime de Workers)
name = "portfolio-blog"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist"
# Astro usa trailingSlash: "always" -> /about/ ; auto-trailing-slash lo resuelve
html_handling = "auto-trailing-slash"
